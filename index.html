<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff5e8">
<title>나만의 고양이 입양 CYOA</title>
<style>
:root{color-scheme:light;--ink:#3b302c;--muted:#71665f;--cream:#fff9f0;--peach:#ffb78e;--border:#ead8c7;--accent:#b85f41;--shadow:0 10px 28px #6a423018}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#ffe8d1,transparent 35%),linear-gradient(135deg,#fff8ed,#fff0e6);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);line-height:1.55}main{max-width:1080px;margin:auto;padding:24px 16px 70px}.hero{text-align:center;padding:38px 18px 26px}.eyebrow{font-size:.82rem;letter-spacing:.18em;font-weight:800;color:#af7259}.hero h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.18;margin:12px 0}.hero p{color:var(--muted);max-width:630px;margin:10px auto}.cat{font-size:60px;display:block;filter:drop-shadow(0 8px 8px #9d7a4e33)}.panel{background:#fffcf8;border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow)}.intro{padding:18px 24px;margin-bottom:20px;text-align:center}.intro p{margin:8px 0}.dashboard{position:sticky;top:8px;z-index:10;background:#fffaf3ed;backdrop-filter:blur(14px);padding:16px 20px;margin-bottom:24px;display:flex;align-items:center;gap:18px;justify-content:space-between}.points{font-size:2rem;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}.small{font-size:.85rem;color:var(--muted)}.meter{height:11px;background:#f0e1d4;overflow:hidden;border-radius:20px;margin-top:8px;width:min(390px,48vw)}#bar{height:100%;width:0;background:#8bbba0;border-radius:20px;transition:width .2s}#bar.over{background:#e37668}.warning{color:#ae3e32;font-weight:750;font-size:.88rem}.good{color:#417c5c;font-weight:750;font-size:.88rem}.categories{display:grid;gap:24px}.category{padding:22px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}.heading h2{font-size:1.38rem;margin:0}.tag{font-size:.79rem;border-radius:99px;padding:5px 10px;background:#f7e8db;color:#865b42;font-weight:700}.subtitle{color:var(--muted);margin:0 0 18px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{background:#fff;border:2px solid #f0e0d1;border-radius:18px;padding:17px;text-align:left;cursor:pointer;color:inherit;font:inherit;min-height:130px;transition:transform .14s,border-color .14s,background .14s;display:flex;flex-direction:column;gap:8px}.choice:hover{transform:translateY(-2px);border-color:#deb292}.choice:focus-visible,button:focus-visible{outline:3px solid #7352a9;outline-offset:2px}.choice.selected{border-color:#c77452;background:#fff1e5;box-shadow:0 0 0 2px #eac4a866}.choice-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.choice-name{font-weight:850;font-size:1.06rem}.cost{padding:3px 9px;background:#f3e4d8;border-radius:100px;color:#86513a;font-weight:800;font-size:.85rem;white-space:nowrap}.description{color:#655d56;font-size:.92rem}.select-indicator{font-size:.83rem;font-weight:800;color:#a85c3d;margin-top:auto}.result{margin-top:25px;padding:25px}.result h2{margin:0 0 10px}.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:18px 0}.result-item{background:#fff3e8;padding:12px;border-radius:12px;font-size:.95rem}.result-item strong{display:block;font-size:.78rem;color:#8f6c59}.actions{display:flex;flex-wrap:wrap;gap:10px}.action{border:0;border-radius:12px;padding:12px 17px;background:#a45f43;color:white;font-weight:800;cursor:pointer;font:inherit}.action.secondary{background:#f0dfd0;color:#684b3e}.action:disabled{opacity:.45;cursor:not-allowed}footer{text-align:center;color:#927c6b;margin-top:24px;font-size:.85rem}@media(max-width:620px){main{padding:12px 12px 50px}.hero{padding:27px 10px 19px}.dashboard{top:4px;padding:12px;gap:7px}.points{font-size:1.55rem}.meter{width:40vw}.category{padding:16px}.choices{grid-template-columns:1fr}.choice{min-height:0;padding:14px}.result-grid{grid-template-columns:1fr}.heading h2{font-size:1.2rem}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main>
<header class="hero"><span class="cat" aria-hidden="true">🐈</span><div class="eyebrow">CHOOSE YOUR OWN ADVENTURE</div><h1>나만의 고양이 입양</h1><p>과연 당신의 집에 찾아올 고양이는 어떤 아이일까요?</p></header>
<section class="panel intro" aria-label="프롤로그"><p>축하합니다! 당신은 드디어 오랫동안 꿈꿔왔던 고양이를 키우기로 결심했습니다.</p><p>하지만 고양이는 저마다 개성도, 성격도, 취향도 다른 법.</p><p><strong>자, 당신의 고양이를 만나러 가봅시다!</strong></p></section>
<div class="panel dashboard" aria-live="polite"><div><div class="small">남은 포인트 · 기초 12P</div><div class="points"><span id="remaining">12</span><span class="small"> P</span></div><div id="status" class="small">각 항목에서 하나씩 선택하세요.</div></div><div><div class="small">사용 <b id="spent">0</b> / 12P</div><div class="meter" role="progressbar" aria-label="포인트 사용량" aria-valuemin="0" aria-valuemax="12" aria-valuenow="0" id="meter"><div id="bar"></div></div></div></div>
<div id="categories" class="categories"></div>
<section class="panel result" id="result"><h2>🐾 우리 집 고양이 프로필</h2><div id="resultMessage" class="small">선택을 완료하면 여기에 결과가 표시됩니다.</div><div class="result-grid" id="resultGrid"></div><div class="actions"><button id="copy" class="action" type="button" disabled>결과 복사</button><button id="reset" class="action secondary" type="button">선택 초기화</button></div></section>
<footer>고양이는 언제나 사랑받아 마땅합니다. 🐾</footer>
</main>
<script>
'use strict';
const DATA=[
 {name:'만남',emoji:'🤝',question:'당신과 고양이는 어떻게 만나게 되었나요?',options:[['분양','정식 분양을 통해 고양이를 데려왔습니다.'],['입양','개인이 돌보던 고양이를 가족으로 맞이했습니다.'],['보호소','보호소에서 당신을 기다리던 아이를 만났습니다.'],['자만추','길에서 운명처럼 만났습니다. 어쩌면 고양이가 당신을 선택했을지도?']]},
 {name:'건강',emoji:'💗',question:'고양이의 건강 상태는 어떤가요?',options:[['위태위태','잔병치레가 많아 세심한 관리가 필요합니다.'],['양호','평범하지만 가끔 병원 신세를 집니다.'],['건강','튼튼하고 활기가 넘치는 고양이입니다.'],['영물','병치레조차 거의 없는 신비로운 고양이. 수명이 평범하지 않을지도 모릅니다.']]},
 {name:'집',emoji:'🏠',question:'고양이에게 어떤 보금자리를 마련해 주었나요?',options:[['박스','비싼 집보다 택배 상자가 좋은 법이죠.'],['숨숨집','아늑하고 포근한 고양이 전용 공간입니다.'],['캣타워','높은 곳에 올라가 집사를 내려다볼 수 있습니다.'],['고양이를 위한 인테리어','캣워크부터 전용 공간까지. 이 집의 진짜 주인은 고양이입니다.']]},
 {name:'입맛',emoji:'🍖',question:'당신의 고양이는 먹는 것을 얼마나 좋아하나요?',options:[['까다로움','사료 냄새만 맡고 돌아섭니다. 입맛 맞추기가 어렵습니다.'],['편식','좋아하는 것만 먹습니다.'],['그럭저럭','대부분의 사료와 간식을 무난하게 먹습니다.'],['먹보','밥이 세상에서 제일 좋습니다! 단, 체중 관리에는 신경 써야겠네요.']]},
 {name:'수속성',emoji:'🛁',question:'고양이가 물을 얼마나 싫어하거나 좋아하나요?',options:[['사탄의 자식','물 한 방울만 닿아도 전쟁이 시작됩니다.'],['지랄묘','목욕하려면 집사도 각오해야 합니다.'],['고양이','평범하게 물을 싫어하지만 참을 수는 있습니다.'],['3대가 덕 쌓은','목욕이 가능하다니! 집안 대대로 덕을 쌓은 게 틀림없습니다.']]}
];
const choice=new Array(DATA.length).fill(null);
const categories=document.getElementById('categories');
DATA.forEach((item,i)=>{const section=document.createElement('section');section.className='panel category';section.innerHTML=`<div class="heading"><h2>${item.emoji} ${item.name}</h2><span class="tag" id="label-${i}">미선택</span></div><p class="subtitle">${item.question}</p>`;const list=document.createElement('div');list.className='choices';item.options.forEach(([name,description],j)=>{const btn=document.createElement('button');btn.type='button';btn.className='choice';btn.setAttribute('aria-pressed','false');btn.innerHTML=`<div class="choice-top"><span class="choice-name">${name}</span><span class="cost">${j+1}P</span></div><span class="description">${description}</span><span class="select-indicator">선택하기</span>`;btn.addEventListener('click',()=>{choice[i]=choice[i]===j?null:j;render()});list.appendChild(btn)});section.appendChild(list);categories.appendChild(section)});
function render(){const spent=choice.reduce((s,v)=>s+(v===null?0:v+1),0),remaining=12-spent,done=choice.every(v=>v!==null),valid=done&&remaining>=0;document.getElementById('remaining').textContent=remaining;document.getElementById('spent').textContent=spent;document.getElementById('bar').style.width=Math.min(100,spent/12*100)+'%';document.getElementById('bar').classList.toggle('over',spent>12);document.getElementById('meter').setAttribute('aria-valuenow',Math.min(12,spent));const status=document.getElementById('status');status.className=spent>12?'warning':valid?'good':'small';status.textContent=spent>12?`${spent-12}P 초과! 선택을 조정해 주세요.`:valid?'입양 준비 완료! 🎉':`선택 ${choice.filter(v=>v!==null).length} / ${DATA.length}개`;DATA.forEach((item,i)=>{const cards=categories.children[i].querySelectorAll('.choice');cards.forEach((b,j)=>{let selected=choice[i]===j;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));b.querySelector('.select-indicator').textContent=selected?'✓ 선택됨':'선택하기'});document.getElementById(`label-${i}`).textContent=choice[i]===null?'미선택':`${choice[i]+1}P 선택`});document.getElementById('resultMessage').textContent=spent>12?'포인트가 부족합니다. 다른 선택지를 골라 주세요.':done?'나만의 고양이 설정이 완성되었습니다!':'아직 선택하지 않은 항목이 있습니다.';document.getElementById('resultGrid').innerHTML=DATA.map((item,i)=>`<div class="result-item"><strong>${item.emoji} ${item.name}</strong>${choice[i]===null?'미선택':item.options[choice[i]][0]+' ('+(choice[i]+1)+'P)'}</div>`).join('');document.getElementById('copy').disabled=!valid;}
function resultText(){return `🐈 나만의 고양이 입양 CYOA\n${DATA.map((item,i)=>`${item.name}: ${item.options[choice[i]][0]} (${choice[i]+1}P)\n↳ ${item.options[choice[i]][1]}`).join('\n')}\n총 사용: ${12-(12-choice.reduce((s,v)=>s+v+1,0))}P / 12P`}
document.getElementById('copy').addEventListener('click',async()=>{const str=resultText();try{await navigator.clipboard.writeText(str)}catch(e){const t=document.createElement('textarea');t.value=str;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok){alert('복사할 수 없습니다. 브라우저 권한을 확인해 주세요.');return}}const b=document.getElementById('copy');b.textContent='✓ 복사 완료';setTimeout(()=>b.textContent='결과 복사',1800)});
document.getElementById('reset').addEventListener('click',()=>{choice.fill(null);render();window.scrollTo({top:0,behavior:'smooth'})});render();
</script></body></html>
